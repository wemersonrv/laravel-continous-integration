name: Deploy

on:
  workflow_run:
    workflows:
      - Laravel Pint
    types:
      - completed
  release:
    types:
      - published

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment: ${{ github.event_name == 'workflow_run' && 'staging' || 'production' }}

    env:
      DEPLOY_URL: ${{ vars.DEPLOY_URL }}
      # monta o JSON completo do evento GitHub
      GITHUB_EVENT_JSON: ${{ toJson(github.event) }}

    steps:
      - name: Debug - show small info
        run: |
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Event name (github.event_name): ${{ github.event_name }}"

      - name: Deploy to RunCloud (mimic GitHub push webhook)
        run: |
          # gera um ID de entrega (igual ao GitHub fornece)
          DELIVERY_ID="$(uuidgen || python - <<'PY'
          import uuid,sys
          print(uuid.uuid4())
          PY
          )"
          # monta payload mínimo parecido com push
          cat > /tmp/runcloud_payload.json <<EOF
          {
            "ref": "${{ github.ref }}",
            "before": "${{ github.event.before || '' }}",
            "after": "${{ github.sha }}",
            "head_commit": {
              "id": "${{ github.sha }}",
              "message": "${{ github.event.workflow_run && github.event.workflow_run.head_commit && github.event.workflow_run.head_commit.message || '' }}",
              "timestamp": "${{ github.event.workflow_run && github.event.workflow_run.updated_at || '' }}",
              "author": { "name": "${{ github.actor }}" }
            },
            "repository": {
              "full_name": "${{ github.repository }}",
              "html_url": "https://github.com/${{ github.repository }}"
            },
            "sender": { "login": "${{ github.actor }}" }
          }
          EOF

          # envia com headers parecidos com o GitHub
          curl -v -X POST "$DEPLOY_URL" \
          -H "Content-Type: application/json" \
          -H "X-GitHub-Event: push" \
          -H "X-GitHub-Delivery: $DELIVERY_ID" \
          -H "User-Agent: GitHub-Hookshot/1.0" \
          --data-binary @/tmp/runcloud_payload.json

name: Deploy

on:
  workflow_run:
    workflows:
      - Laravel Pint
    types:
      - completed
  release:
    types:
      - published

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment: ${{ github.event_name == 'workflow_run' && 'staging' || 'production' }}

    env:
      DEPLOY_URL: ${{ vars.DEPLOY_URL }}
      # monta o JSON completo do evento GitHub
      GITHUB_EVENT_JSON: ${{ toJson(github.event) }}

    steps:
      - name: Deploy to Runcloud (Staging or Production)
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_HOOK_SECRET: ${{ secrets.DEPLOY_HOOK_SECRET || '' }}

          # workflow_run (staging)
          WF_HEAD_SHA: ${{ github.event.workflow_run.head_sha || '' }}
          WF_COMMIT_MSG: ${{ github.event.workflow_run.head_commit.message || 'CI deploy trigger' }}

          # repo / releases
          REPO_FULL: ${{ github.repository }}
          REL_TAG: ${{ github.event.release.tag_name || '' }}
          REL_NAME: ${{ github.event.release.name || '' }}
          REL_BODY: ${{ github.event.release.body || '' }}
        run: |
          set -euo pipefail

          # RunCloud requires ref to be the branch deployed
          REF="refs/heads/main"

          #############################################
          # 1) Determine AFTER (commit SHA)
          #############################################

          if [ "${GITHUB_EVENT_NAME:-}" = "release" ]; then
            TAG="${REL_TAG}"

            # Try direct lookup via tag ref
            AFTER=""
            if [ -n "$TAG" ]; then
              AFTER=$(curl -sS \
                -H "Authorization: token ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${REPO_FULL}/git/ref/tags/${TAG}" \
                | jq -r '.object.sha // empty')
            fi

            # Fallback: list tags (covers annotated tags)
            if [ -z "$AFTER" ] && [ -n "$TAG" ]; then
              AFTER=$(curl -sS \
                -H "Authorization: token ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${REPO_FULL}/tags" \
                | jq -r --arg t "$TAG" '.[] | select(.name==$t) | .commit.sha' \
                | head -n1)
            fi

            # Final fallback: workflow SHA
            [ -z "$AFTER" ] && AFTER="${WF_HEAD_SHA:-${GITHUB_SHA:-}}"

            #############################################
            # 2) Build "New Release vX.Y.Z"
            #############################################
            VERSION=""
            [ -n "${REL_TAG}" ] && VERSION="${REL_TAG}"
            [ -z "$VERSION" ] && [ -n "${REL_NAME}" ] && VERSION="${REL_NAME}"
            if [ -z "$VERSION" ] && [ -n "${REL_BODY}" ]; then
              VERSION="$(printf '%s' "${REL_BODY}" | grep -oE 'v[0-9]+(\.[0-9]+)*' | head -n1 || true)"
            fi
            COMMIT_MSG="New Release ${VERSION:-Release}"

          else
            #############################################
            # workflow_run (staging)
            #############################################
            AFTER="${WF_HEAD_SHA:-${GITHUB_SHA:-}}"
            COMMIT_MSG="${WF_COMMIT_MSG}"
          fi

          #############################################
          # 3) Determine BEFORE (parent commit)
          #############################################

          # ensure jq exists
          command -v jq >/dev/null 2>&1 || {
            sudo apt-get update -y
            sudo apt-get install -y jq
          }

          BEFORE=$(curl -sS \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO_FULL}/commits/${AFTER}" \
            | jq -r '.parents[0].sha // empty')

          # fallback: if no parent (initial commit)
          [ -z "${BEFORE}" ] && BEFORE="${AFTER}"

          #############################################
          # 4) Escape commit message for JSON
          #############################################
          ESC_MSG=$(printf '%s' "$COMMIT_MSG" \
            | sed -e 's/\\/\\\\/g' \
                  -e 's/"/\\"/g' \
                  -e ':a;N;$!ba;s/\n/\\n/g')

          #############################################
          # 5) Build final JSON payload
          #############################################
          cat > /tmp/runcloud_push_payload.json <<EOF
          {
            "ref": "${REF}",
            "before": "${BEFORE}",
            "after": "${AFTER}",
            "repository": { "full_name": "${REPO_FULL}" },
            "head_commit": {
              "id": "${AFTER}",
              "url": "https://github.com/${REPO_FULL}/commit/${AFTER}",
              "message": "${ESC_MSG}",
              "committer": { "name": "${GITHUB_ACTOR:-}" }
            }
          }
          EOF

          #############################################
          # 6) Optional HMAC signature
          #############################################
          SIGN_HEADER=""
          if [ -n "${DEPLOY_HOOK_SECRET}" ]; then
          SIG=$(openssl dgst -sha256 -hmac "${DEPLOY_HOOK_SECRET}" -binary < /tmp/runcloud_push_payload.json | xxd -p -c 256)
          SIGN_HEADER="X-Hub-Signature-256: sha256=${SIG}"
          fi

          #############################################
          # 7) POST to RunCloud
          #############################################
          curl -sS -X POST "${DEPLOY_URL}" \
          -H "Content-Type: application/json" \
          -H "X-GitHub-Event: push" \
          -H "X-GitHub-Delivery: $(uuidgen || cat /proc/sys/kernel/random/uuid)" \
          -H "User-Agent: GitHub-Hookshot/1.0" \
          ${SIGN_HEADER:+-H "$SIGN_HEADER"} \
          --data-binary @/tmp/runcloud_push_payload.json

name: Deploy

on:
  workflow_run:
    workflows:
      - Laravel Pint
    types:
      - completed
  release:
    types:
      - published

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment: ${{ github.event_name == 'workflow_run' && 'staging' || 'production' }}

    env:
      DEPLOY_URL: ${{ vars.DEPLOY_URL }}
      # monta o JSON completo do evento GitHub
      GITHUB_EVENT_JSON: ${{ toJson(github.event) }}

    steps:
      - name: Debug - show small info
        run: |
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Event name (github.event_name): ${{ github.event_name }}"

      - name: Build payload with 'before' (parent SHA) & POST (bash only) + FIX for release workflow
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_HOOK_SECRET: ${{ secrets.DEPLOY_HOOK_SECRET || '' }}
          WF_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch || '' }}
          WF_HEAD_SHA: ${{ github.event.workflow_run.head_sha || '' }}
          WF_COMMIT_MSG: ${{ github.event.workflow_run.head_commit.message || 'CI deploy trigger' }}
          REPO_FULL: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Forçar ref = refs/heads/main como exigido pela Runcloud
          REF="refs/heads/main"

          AFTER="${WF_HEAD_SHA:-${GITHUB_SHA:-}}"
          if [ -z "${AFTER}" ]; then
            echo "ERROR: cannot determine AFTER (commit sha)" >&2
            exit 1
          fi

          REPO_FULL="${REPO_FULL:-${GITHUB_REPOSITORY}}"
          COMMIT_MSG="${WF_COMMIT_MSG}"

          # ensure jq exists
          if ! command -v jq >/dev/null 2>&1; then
            echo "jq not found — installing..."
            sudo apt-get update -y
            sudo apt-get install -y jq
          fi

          # query commit info and get parent sha
          COMMIT_JSON="$(curl -sS -H "Accept: application/vnd.github+json" -H "Authorization: token ${GH_TOKEN}" https://api.github.com/repos/${REPO_FULL}/commits/${AFTER})"

          BEFORE="$(printf '%s' "$COMMIT_JSON" | jq -r '.parents[0].sha // empty')"

          if [ -z "${BEFORE}" ]; then
            BEFORE="${AFTER}"
          fi

          echo "AFTER: ${AFTER}"
          echo "BEFORE: ${BEFORE}"
          echo "Repo: ${REPO_FULL}"
          echo "Ref: ${REF}"

          ESC_MSG=$(printf '%s' "$COMMIT_MSG" | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g' -e ':a' -e 'N' -e '$!ba' -e 's/\n/\\n/g')

          cat > /tmp/runcloud_push_payload.json <<EOF
          {
            "ref": "${REF}",
            "before": "${BEFORE}",
            "after": "${AFTER}",
            "repository": {
              "full_name": "${REPO_FULL}"
            },
            "head_commit": {
              "id": "${AFTER}",
              "url": "https://github.com/${REPO_FULL}/commit/${AFTER}",
              "message": "${ESC_MSG}",
              "committer": { "name": "${GITHUB_ACTOR:-}" }
            }
          }
          EOF

          SIGN_HEADER=""
          if [ -n "${DEPLOY_HOOK_SECRET}" ]; then
            SIG=$(openssl dgst -sha256 -hmac "${DEPLOY_HOOK_SECRET}" -binary < /tmp/runcloud_push_payload.json | xxd -p -c 256)
            SIGN_HEADER="X-Hub-Signature-256: sha256=${SIG}"
          fi

          curl -sS -D /tmp/runcloud_resp_headers.txt -o /tmp/runcloud_resp_body.txt \
          -X POST "${DEPLOY_URL}" \
          -H "Content-Type: application/json" \
          -H "X-GitHub-Event: push" \
          -H "X-GitHub-Delivery: $(uuidgen || python -c 'import uuid; print(uuid.uuid4())')" \
          -H "User-Agent: GitHub-Hookshot/1.0" \
          ${SIGN_HEADER:+-H "$SIGN_HEADER"} \
          --data-binary @/tmp/runcloud_push_payload.json || true

          echo "Payload bytes: $(wc -c < /tmp/runcloud_push_payload.json)"
          sed -n '1,160p' /tmp/runcloud_push_payload.json || true
          echo "=== Response headers ==="
          sed -n '1,160p' /tmp/runcloud_resp_headers.txt || true
          echo "=== Response body (first 800 chars) ==="
          head -c 800 /tmp/runcloud_resp_body.txt || true

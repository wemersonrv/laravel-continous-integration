name: Deploy

on:
  workflow_run:
    workflows:
      - Laravel Pint
    types:
      - completed
  release:
    types:
      - published

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment: ${{ github.event_name == 'workflow_run' && 'staging' || 'production' }}

    env:
      DEPLOY_URL: ${{ vars.DEPLOY_URL }}
      # monta o JSON completo do evento GitHub
      GITHUB_EVENT_JSON: ${{ toJson(github.event) }}

    steps:
      - name: Debug - show small info
        run: |
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Event name (github.event_name): ${{ github.event_name }}"

      - name: Get last push payload from GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/events \
            | jq '[ .[] | select(.type=="PushEvent") ][0].payload' \
            > /tmp/push_payload.json

          echo "=== PUSH PAYLOAD ==="
          head -c 500 /tmp/push_payload.json

      - name: Send PUSH payload to webhook
        env:
          WEBHOOK_URL: ${{ vars.DEPLOY_URL }}
        run: |
          curl -sS -D /tmp/h.txt -o /tmp/b.txt \
            -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -H "X-GitHub-Delivery: $(uuidgen)" \
            --data-binary @/tmp/push_payload.json

          echo "HEADERS:"
          sed -n '1,60p' /tmp/h.txt

          echo "BODY:"
          head -c 500 /tmp/b.txt

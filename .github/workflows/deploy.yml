name: Deploy

on:
  workflow_run:
    workflows:
      - Laravel Pint
    types:
      - completed
  release:
    types:
      - published

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment: ${{ github.event_name == 'workflow_run' && 'staging' || 'production' }}

    env:
      DEPLOY_URL: ${{ vars.DEPLOY_URL }}
      # monta o JSON completo do evento GitHub
      GITHUB_EVENT_JSON: ${{ toJson(github.event) }}

    steps:
      - name: Debug - show small info
        run: |
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Event name (github.event_name): ${{ github.event_name }}"

      - name: Deploy to RunCloud (debug response body + headers)
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        run: |
          set -euo pipefail
          DELIVERY_ID="$(uuidgen || python - <<'PY'
          import uuid
          print(uuid.uuid4())
          PY
          )"
          # assume /tmp/push_payload.json already exists (se não, gere o payload como antes)
          # envia e salva headers e body
          curl -sS -D /tmp/runcloud_resp_headers.txt \
          -o /tmp/runcloud_resp_body.html \
          -X POST "$DEPLOY_URL" \
          -H "Content-Type: application/json" \
          -H "X-GitHub-Event: push" \
          -H "X-GitHub-Delivery: $DELIVERY_ID" \
          -H "User-Agent: GitHub-Hookshot/1.0" \
          --data-binary @/tmp/push_payload.json || true

          echo "==== Response headers ===="
          sed -n '1,200p' /tmp/runcloud_resp_headers.txt || true
          echo "==== Response body (first 500 chars) ===="
          head -c 500 /tmp/runcloud_resp_body.html || true
          echo
          echo "Saved full response body to /tmp/runcloud_resp_body.html (inspect in workflow logs or upload artifact)"
          # opcional: fazer upload como artifact (descomente se quiser)
          # mkdir -p /github/workspace/artifacts && cp /tmp/runcloud_resp_body.html /github/workspace/artifacts/ && echo "Artifact saved"
